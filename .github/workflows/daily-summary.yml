name: Daily Horizon 2-Week Informatique Summary

on:
  schedule:
    - cron: '0 6 * * *'   # 8h heure de Paris (CEST/UTC+2) - été
  workflow_dispatch:      # Allow manual trigger

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Needed to commit changes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Prepare configuration
        run: |
          mkdir -p data
          echo "📁 Contenu de data/ :"
          ls -lah data/
          if [ ! -f data/config.json ]; then
            cp data/config.example.json data/config.json
            echo "✅ Config créé depuis l'exemple"
          fi
          echo "📁 Vérification finale :"
          ls -lah data/config.json

      - name: Run Horizon
        env:
          # Map secrets to environment variables expected by config.json
          # Modify these based on your config.json provider settings
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: uv run horizon --hours 336 --theme "full informatique"

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./docs
          keep_files: true  # Keep existing summaries on gh-pages branch
          commit_message: "📝 Daily Summary: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true

      - name: Upload to Neocities
        if: success()
        run: |
          if [ -z "${{ secrets.NEOCITIES_API_KEY }}" ]; then
            echo "⚠️  NEOCITIES_API_KEY not configured - skipping upload"
            exit 0
          fi
          
          DATE=$(date +'%Y-%m-%d')
          HTML_FILE="data/summaries/horizon-${DATE}-bilingual.html"
          
          if [ ! -f "$HTML_FILE" ]; then
            echo "❌ HTML file not found: $HTML_FILE"
            exit 1
          fi
          
          echo "📤 Uploading to Neocities as index.html..."
          curl -H "Authorization: Bearer ${{ secrets.NEOCITIES_API_KEY }}" \
            -F "index.html=@${HTML_FILE}" \
            "https://neocities.org/api/upload"
          
          echo "✅ Upload complete"
      - name: REmove HTML file
        if: success()
        run: |
          DATE=$(date +'%Y-%m-%d')
          HTML_FILE="data/summaries/horizon-${DATE}-bilingual.html"
          if [ -f "$HTML_FILE" ]; then
            rm "$HTML_FILE"
            echo "🗑️  Removed local HTML file: $HTML_FILE"
          elif [ -f "data/summaries/horizon-${DATE}-en.html" ]; then
            rm "data/summaries/horizon-${DATE}-en.html"
            echo "🗑️  Removed local HTML file: data/summaries/horizon-${DATE}-en.html"
          elif [ -f "data/summaries/horizon-${DATE}-fr.html" ]; then
            rm "data/summaries/horizon-${DATE}-fr.html"
            echo "🗑️  Removed local HTML file: data/summaries/horizon-${DATE}-fr.html"
          else
            echo "⚠️  HTML file not found for cleanup: $HTML_FILE"
          fi
