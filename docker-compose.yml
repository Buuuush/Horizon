services:
  dashboard:
    build: .
    container_name: horizon-dashboard
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    command: ["uvicorn", "src.web.app:app", "--host", "0.0.0.0", "--port", "5000"]
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G

  orchestrator:
    build: .
    container_name: horizon-orchestrator
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '16'
          memory: 16G
        reservations:
          cpus: '12'
          memory: 10G
    # Run daily at 8:00 AM UTC via cron (configure outside Docker)
    # For one-time run: docker-compose run --rm orchestrator horizon --hours 48 --summary-format html
    # Pass theme to focus: docker-compose run --rm orchestrator horizon --hours 48 --summary-format html --theme "informatique"
    command: ["horizon", "--hours", "24", "--summary-format", "html"]
